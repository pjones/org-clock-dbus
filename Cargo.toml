[package]
name = "org-clock-dbus"
version = "1.0.0"
description = "Interact with org-clock through dbus"
authors = ["Peter J. Jones <pjones@devalot.com>"]
edition = "2021"
readme = "README.org"
license = "GPL-3.0-or-later"
keywords = ["cli", "dbus", "emacs", "org-mode"]
categories = ["command-line-utilities"]

[[bin]]
name = "org-clock-dbus"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde_json = { version = "1.0.150"}
dbus = { version = "0.9.11" }
strfmt = "0.2.5"
chrono = "0.4.45"
humantime = "2.3.0"
