name: Build, Test, and Release

on:
  workflow_dispatch:
  pull_request:
    branches: [ "trunk" ]
  push:
    branches: [ "trunk" ]
    tags:
      - 'v[0-9]+**'
env:
  CARGO_TERM_COLOR: always

jobs:
  build-with-cargo:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: sudo apt -qq install -y libdbus-1-dev pkg-config
    - name: Run tests
      run: cargo test --verbose

  build-with-nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-24.04", "ubuntu-24.04-arm" ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34
      - run: nix flake check --print-build-logs

      - name: Upload Static Binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-${{ runner.arch }}
          path: |
            result/bin/org-clock-dbus
            lisp/org-clock-dbus.el

  publish:
    permissions: write-all
    needs: build-with-nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: nixbuild/nix-quick-install-action@v34

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          skip-decompress: true

      - name: Verify archives from previous jobs
        run: |
          if [[ ! -d artifacts ]] || [[ "$(find artifacts -type f -name '*.zip' | wc -l)" -eq 0 ]]; then
            echo >&2 "ERROR: the download-artifact step failed"
            exit 1
          fi

      - run: nix build .#changelog --print-build-logs
      - run: cp result/changelog.md artifacts

      - name: Publish Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body_path: ${{ github.workspace }}/artifacts/changelog.md
          make_latest: true
          working_directory: artifacts
          fail_on_unmatched_files: true
          files: "*.zip"
